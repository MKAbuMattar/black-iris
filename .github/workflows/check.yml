name: check

on:
  push:
  pull_request:

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Python lint
        run: python3 skills/black-iris/scripts/universal/check.py
      - name: Bash lint
        run: bash skills/black-iris/scripts/${{ matrix.os == 'macos-latest' && 'mac' || 'linux' }}/check.sh
      - name: Manifests parse
        run: |
          for f in .claude-plugin/*.json .codex-plugin/*.json .agents/plugins/*.json hooks/hooks.json *.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" && echo "ok $f"
          done
      - name: Hook dry run
        run: |
          H=$(mktemp -d); mkdir -p "$H/.BLACK_IRIS_AGENTS/projects/-p/memory"
          echo '- [t](a.md) - h' > "$H/.BLACK_IRIS_AGENTS/projects/-p/memory/MEMORY.md"
          test -z "$(HOME=$H CLAUDE_PLUGIN_ROOT=$PWD sh hooks/reinject.sh)" || { echo "hook printed without the flag"; exit 1; }
          touch "$H/.BLACK_IRIS_AGENTS/always-on"
          out=$(HOME=$H CLAUDE_PLUGIN_ROOT=$PWD CLAUDE_PROJECT_DIR=/p sh hooks/reinject.sh)
          echo "$out" | grep -q 'black-iris skill root' || { echo "no root line"; exit 1; }
          echo "$out" | grep -q '| Always on: every response |' || { echo "no body"; exit 1; }
          echo "$out" | grep -q '\[t\](a.md)' || { echo "no memory index"; exit 1; }
          # The hook sends the router, never the references. It fires on
          # compact, so every byte here is spent by the event that exists to
          # free the window. These two assertions are what keep it honest.
          echo "$out" | grep -q '^# references/' && { echo "hook dumped a reference file"; exit 1; }
          echo "$out" | grep -qi 'Evals: measuring whether this skill works' && { echo "hook leaked the maintainer doc"; exit 1; }
          n=$(printf '%s' "$out" | wc -c)
          echo "hook payload: $n bytes"
          [ "$n" -lt 20000 ] || { echo "hook payload $n over the 20000 byte ceiling"; exit 1; }
      - name: Gates Stop hook blocks only when it should
        run: |
          H=$(mktemp -d); P=/proj; S="$H/.BLACK_IRIS_AGENTS/projects/-proj"; mkdir -p "$S"
          run() { printf '{"session_id":"s1"}' | HOME=$H CLAUDE_PROJECT_DIR=$P sh hooks/gates-stop.sh 2>"$H/e"; echo $?; }
          want() { [ "$1" = "$2" ] || { echo "$3: wanted exit $2, got $1"; exit 1; }; }
          want "$(run)" 0 "flag absent"
          mkdir -p "$H/.BLACK_IRIS_AGENTS"; touch "$H/.BLACK_IRIS_AGENTS/gates-stop"
          want "$(run)" 0 "no ledger"
          printf -- '- [x] G1: done\n' > "$S/GATES.md"
          want "$(run)" 0 "all met"
          printf -- '- [x] G1: done\n- [ ] G2: no\n- [ ] G3: no\n' > "$S/GATES.md"
          want "$(run)" 2 "unmet gates must block"
          grep -q 'G2 G3' "$H/e" || { echo "block did not name the unmet ids"; exit 1; }
          want "$(run)" 0 "same ledger state must not block twice"
          printf -- '- [x] G1: done\n- [ ] G2: no\nABANDON: G3 gone\n' > "$S/GATES.md"
          want "$(run)" 2 "unmet gate beside an abandoned one still blocks"
          grep -q 'unmet gates: G2$' "$H/e" || { echo "abandoned id should not be listed"; exit 1; }
          printf -- '- [x] G1: done\n- [x] G2: done\nABANDON: G3 gone\n' > "$S/GATES.md"
          want "$(run)" 0 "handoff is a valid stop"
          echo "gates-stop: all seven paths correct"

      - name: Hook fallbacks (no plugin root, no project dir)
        run: |
          H=$(mktemp -d); mkdir -p "$H/.BLACK_IRIS_AGENTS"; touch "$H/.BLACK_IRIS_AGENTS/always-on"
          P=$(mktemp -d); git -C "$P" init -q
          # Derive the slug the way the hook does: from git's top level, which macOS resolves to /private/var.
          slug=$(git -C "$P" rev-parse --show-toplevel | tr '/' '-')
          mkdir -p "$H/.BLACK_IRIS_AGENTS/projects/$slug/memory"; echo '- [fb](b.md) - h' > "$H/.BLACK_IRIS_AGENTS/projects/$slug/memory/MEMORY.md"
          out=$(cd "$P/." && env -u CLAUDE_PLUGIN_ROOT -u CLAUDE_PROJECT_DIR HOME=$H sh "$GITHUB_WORKSPACE/hooks/reinject.sh")
          echo "$out" | grep -q 'black-iris skill root' || { echo "script-relative root failed"; exit 1; }
          echo "$out" | grep -q '\[fb\](b.md)' || { echo "git-toplevel slug failed"; exit 1; }

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Eval cases parse, ids are unique, coverage is reported
        run: python3 evals/cases.py stats
      - name: Runner syntax
        run: bash -n evals/run.sh

  release-ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Manifests agree, changelog has the section, release gate covers them
        run: python3 .github/scripts/release-ready.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Python lint
        run: python skills/black-iris/scripts/universal/check.py
      - name: PowerShell lint
        run: pwsh skills/black-iris/scripts/windows/check.ps1
      - name: Installer dry run
        shell: pwsh
        run: |
          $env:HOME = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'home') | Select-Object -ExpandProperty FullName
          pwsh skills/black-iris/scripts/windows/install.ps1 -AlwaysOn
          if (-not (Test-Path (Join-Path $env:HOME '.claude/skills/black-iris'))) { throw 'not installed' }
          pwsh skills/black-iris/scripts/windows/install.ps1 -Uninstall
